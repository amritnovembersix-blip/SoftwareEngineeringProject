# supervised: graded's reviewers, changed by the prompt audit (docs/superpowers/specs/2026-11-18-reviewer-fixes-design.md),
# plus three checking steps (docs/superpowers/specs/2026-11-17-review-supervisor-design.md): a planner (per assignment:
# which grade 3-5 writing and reading reviewers run), a critic (keeps or drops each growth area against its cited
# evidence) and an arbiter (one problem, one standard). Each step can be switched off per run.
# Reviewer fixes: per_standard.v5 (support levels defined, R6) and progression.v5 (a failed step names its lines, R1);
# conditions.v3 (R5). R3 (one 3-5 language reviewer, lowest grade first) was tried and undone after it lost grade 5
# language recall (docs/evaluations/2026-11-18-reviewer-fixes-phase1-2.00-control-wk3.md).
[profiles.supervised]
conditions = "conditions.v3"

[[profiles.supervised.reviewers]]
id = "3-language"
grades = [3, 3]
strands = ["L"]
mode = "per_standard"
prompt = "per_standard.v5"
reasoning = "low"

[[profiles.supervised.reviewers]]
id = "3-writing"
grades = [3, 3]
strands = ["W"]
mode = "per_standard"
prompt = "per_standard.v5"
reasoning = "low"

[[profiles.supervised.reviewers]]
id = "3-reading"
grades = [3, 3]
strands = ["R"]
mode = "per_standard"
prompt = "per_standard.v5"
reasoning = "low"

[[profiles.supervised.reviewers]]
id = "4-language"
grades = [4, 4]
strands = ["L"]
mode = "per_standard"
prompt = "per_standard.v5"
reasoning = "low"

[[profiles.supervised.reviewers]]
id = "4-writing"
grades = [4, 4]
strands = ["W"]
mode = "per_standard"
prompt = "per_standard.v5"
reasoning = "low"

[[profiles.supervised.reviewers]]
id = "4-reading"
grades = [4, 4]
strands = ["R"]
mode = "per_standard"
prompt = "per_standard.v5"
reasoning = "low"

[[profiles.supervised.reviewers]]
id = "5-language"
grades = [5, 5]
strands = ["L"]
mode = "per_standard"
prompt = "per_standard.v5"
reasoning = "low"

[[profiles.supervised.reviewers]]
id = "5-writing"
grades = [5, 5]
strands = ["W"]
mode = "per_standard"
prompt = "per_standard.v5"
reasoning = "low"

[[profiles.supervised.reviewers]]
id = "5-reading"
grades = [5, 5]
strands = ["R"]
mode = "per_standard"
prompt = "per_standard.v5"
reasoning = "low"

[[profiles.supervised.reviewers]]
id = "6+-writing"
grades = [6, "course"]
strands = ["W"]
mode = "search"
prompt = "progression.v5"
reasoning = "high"

[[profiles.supervised.reviewers]]
id = "6+-reading"
grades = [6, "course"]
strands = ["RL", "RI"]
mode = "search"
prompt = "progression.v5"
reasoning = "high"

[profiles.supervised.supervisor]
planner = true
critic = true
arbiter = true
planner_prompt = "planner.v1"
critic_prompt = "critic.v1"
arbiter_prompt = "arbiter.v1"
planner_reasoning = "low"
critic_reasoning = "high"
arbiter_reasoning = "high"
critic_max_items = 60
arbiter_max_clusters = 15
