[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic"
version = "0.1.0"
description = "SASS agentic essay-review MVP"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "google-genai>=1.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tzdata>=2024.1",  # IANA zones for review-policy timezones on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["db: needs local Postgres", "live: calls real external APIs"]
addopts = "-m 'not live'"
