openapi: 3.1.0
info:
  title: SASS Agentic Service API
  version: 0.1.0-draft
  description: |
    Status: DRAFT · Author: Justin Keck · Owner: TBD · Last changed: 2026-10-08

    Starts agentic reviews of student submissions against the Missouri Learning Standards,
    reports run status, and manages the review policy.

    - Every trigger reduces to the same job: review a submission attempt unless it has already
      been reviewed. The idempotency key is (lms_submission_id, attempt).
    - Results (observations, findings, trend insights) are NOT served here. Consumers read
      them from Postgres (see db/migrations/).
    - Work is asynchronous: triggers return 202 with a run_id to poll.
    - IDs: every course, assignment, student (user), and submission ID in this API is the
      LMS's ID (as in contracts/mock-lms-api.yaml), never a SASS database key. `run_id` is the
      only SASS-issued ID. In Postgres the LMS IDs live in the `lms_*` columns.

    Implementation status (agentic/src/agentic/service/, `python -m agentic serve`):
    - Built: /health, /events/submission-graded, /runs/{run_id}, GET/PUT /review-policy.
    - Runs are held in memory and lost on restart; the Postgres writer still refuses a second
      review of an attempt (the run then reports a skip with reason `already_reviewed`).
    - The policy is held in memory. `on_grade` takes effect; `on_due_date` and `schedules` are
      validated and stored but nothing fires them yet (no scheduler).
    - /sweeps and /trend-analyses return 501 `not_implemented` until the LMS Target can list
      submissions and trend analysis exists.
servers:
  - url: http://localhost:8000
    description: Local agentic service (docker compose)
security:
  - serviceToken: []
paths:
  /events/submission-graded:
    post:
      operationId: submissionGraded
      summary: Receive the LMS submission_graded webhook (on_grade mode)
      description: |
        - If `on_grade` is disabled, the event is acknowledged and ignored
          (`ignored: true`, `reason: mode_disabled`).
        - If this (submission_id, attempt) was already reviewed or is being reviewed, the
          existing run is returned with `duplicate: true` (LMS webhooks may be delivered more
          than once, and re-grades send the event again).
        - The event is a notification only. The service fetches the attempt from the LMS and
          ignores any grade or state data in the event.
      security:
        - webhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionGradedEvent'
      responses:
        '202':
          description: Accepted, duplicate, or ignored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /sweeps:
    post:
      operationId: startSweep
      summary: Review every eligible submission not yet reviewed (manual or catch-up)
      description: |
        Reviews the latest attempt of each submitted, non-excused submission in scope that has
        not been reviewed, including attempts whose earlier review failed.
        With no body, the scope is every assignment in every active course.
        Safe to repeat: already-reviewed attempts are skipped.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SweepRequest'
      responses:
        '202':
          description: Sweep started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerAccepted'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /trend-analyses:
    post:
      operationId: startTrendAnalysis
      summary: Start a trend analysis for a student or a classroom (planned)
      x-status: planned
      description: |
        PLANNED. Analyses persisted findings (never student text) and writes an immutable
        trend_insight. Superseded attempts are excluded. Findings a teacher disagreed with or
        dismissed are excluded or down-weighted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrendAnalysisRequest'
      responses:
        '202':
          description: Analysis started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerAccepted'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /runs/{run_id}:
    get:
      operationId: getRun
      summary: Get the status of a run
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /review-policy:
    get:
      operationId: getReviewPolicy
      summary: Get the system-wide review policy
      responses:
        '200':
          description: The current policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: putReviewPolicy
      summary: Replace the review policy (app admin)
      description: |
        Validates every cron expression and the timezone, then reloads the scheduler.
        Invalid input returns 422 (error codes `invalid_cron`, `invalid_timezone`) and leaves
        the current policy unchanged.
        Proposed: restricted to a new "app admin" role (the proposal defines only teacher and
        student).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPolicy'
      responses:
        '200':
          description: The saved policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /health:
    get:
      operationId: health
      summary: Liveness check
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: Service-to-service token from `AGENTIC_API_TOKEN`.
    webhookSecret:
      type: apiKey
      in: header
      name: X-SASS-Webhook-Secret
      description: Shared secret from `WEBHOOK_SECRET`, sent by the LMS.
  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotImplemented:
      description: Not built yet (see the implementation status above). Error code `not_implemented`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
    SubmissionGradedEvent:
      type: object
      description: The same shape as the mock LMS webhook (contracts/mock-lms-api.yaml).
      required: [metadata, body]
      properties:
        metadata:
          type: object
          required: [event_name, event_time]
          properties:
            event_name:
              type: string
              const: submission_graded
            event_time:
              type: string
              format: date-time
        body:
          type: object
          required: [submission_id, assignment_id, course_id, user_id, attempt]
          properties:
            submission_id:
              type: string
            assignment_id:
              type: string
            course_id:
              type: string
            user_id:
              type: string
            attempt:
              type: integer
              minimum: 1
    SweepRequest:
      type: object
      description: Optional scope. `assignment_id` requires `course_id`.
      properties:
        course_id:
          type: string
          description: LMS course ID.
        assignment_id:
          type: string
          description: LMS assignment ID.
      dependentRequired:
        assignment_id: [course_id]
    TrendAnalysisRequest:
      type: object
      description: Exactly one of `student_id` or `course_id`.
      oneOf:
        - required: [student_id]
        - required: [course_id]
      properties:
        student_id:
          type: string
          description: LMS user ID of the student.
        course_id:
          type: string
          description: LMS course ID (classroom-level analysis).
    TriggerAccepted:
      type: object
      required: [run_id, duplicate, ignored]
      properties:
        run_id:
          type: [string, 'null']
          description: null only when `ignored` is true.
        duplicate:
          type: boolean
          description: true when an existing run for this attempt was returned.
        ignored:
          type: boolean
        reason:
          type: [string, 'null']
          enum: [mode_disabled, null]
    SkipReason:
      type: string
      enum:
        - already_reviewed
        - excused
        - not_submitted
        - unsupported_subject
        - no_standards_in_scope
      description: |
        - `unsupported_subject`: the course is not ELA (Math is future work).
        - `no_standards_in_scope`: the course grade is below the corpus (grades 3–12).
    Run:
      type: object
      required:
        - run_id
        - run_type
        - trigger
        - status
        - submission_count
        - completed_count
        - skipped_count
        - skips
        - created_at
      properties:
        run_id:
          type: string
        run_type:
          type: string
          enum: [submission_review, trend_analysis]
        trigger:
          type: string
          enum: [on_grade, on_due_date, scheduled, manual, after_review]
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        submission_count:
          type: integer
          minimum: 0
        completed_count:
          type: integer
          minimum: 0
        skipped_count:
          type: integer
          minimum: 0
        skips:
          type: array
          items:
            type: object
            required: [submission_id, reason]
            properties:
              submission_id:
                type: string
                description: LMS submission ID.
              attempt:
                type: [integer, 'null']
                minimum: 1
                description: null when the student has not submitted.
              reason:
                $ref: '#/components/schemas/SkipReason'
        error:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
    ReviewPolicy:
      type: object
      required: [submission_review, trend_analysis, timezone]
      properties:
        submission_review:
          type: object
          required: [on_grade, on_due_date, schedules]
          properties:
            on_grade:
              type: boolean
              description: Review when the LMS reports a submission as graded.
            on_due_date:
              type: boolean
              description: |
                Review each student's latest attempt when their effective due date
                (cached_due_date) passes. Late work is picked up by the next sweep or grading.
            schedules:
              type: array
              description: Cron expressions (5-field), in `timezone`. Each fires a sweep.
              items:
                type: string
                examples: ['0 2 * * *']
        trend_analysis:
          type: object
          x-status: planned
          required: [after_review, min_new_findings, schedules]
          properties:
            after_review:
              type: boolean
            min_new_findings:
              type: integer
              minimum: 1
            schedules:
              type: array
              items:
                type: string
        timezone:
          type: string
          description: IANA timezone name.
          examples: [America/Chicago]
      examples:
        - submission_review:
            on_grade: true
            on_due_date: false
            schedules: ['0 2 * * *']
          trend_analysis:
            after_review: false
            min_new_findings: 3
            schedules: []
          timezone: America/Chicago
