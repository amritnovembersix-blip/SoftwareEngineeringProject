[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-lab"
version = "0.1.0"
description = "SASS agentic lab: synthetic data, essay generator, evaluation, Streamlit demo"
requires-python = ">=3.11"
dependencies = [
    "agentic",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["db: needs local Postgres", "live: calls real external APIs"]
addopts = "-m 'not live'"
