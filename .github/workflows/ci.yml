
name: SASS automated tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sass
          POSTGRES_USER: sass
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sass -d sass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Test-only credentials. Do not use real API keys.
      DATABASE_URL: postgresql://sass:change-me@localhost:5432/sass
      DATABASE_URL_LOCAL: postgresql://sass:change-me@localhost:5432/sass
      DATA_DIR: ../AgenticLab/data/synthetic
      FAKE_LLM: '1'
      VERIFY: '0'
      AGENTIC_API_TOKEN: ci-test-token
      WEBHOOK_SECRET: ci-test-webhook-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e './Backend[dev]' \
            -e './AgenticAI[dev]' \
            -e './AgenticLab[dev]'

      - name: Apply PostgreSQL migrations V1-V8
        run: |
          docker run --rm --network host \
            -v "$PWD/AgenticAI/db/migrations:/flyway/sql:ro" \
            flyway/flyway:10 \
            -url=jdbc:postgresql://localhost:5432/sass \
            -user=sass \
            -password=change-me \
            -locations=filesystem:/flyway/sql \
            -connectRetries=10 migrate

      # Some existing tests expect this legacy directory name.
      # The symlink does not change project source files.
      - name: Provide legacy test fixture path
        run: |
          ln -s AgenticLab agentic_lab
          test -f \
            agentic_lab/data/synthetic/courses/2.00-control/submissions/ela9v2-a02.jsonl

      # Run these tests before loading any persistent demo reviews.
      # Some AgenticAI test fixtures require a clean database.
      - name: Run AgenticAI tests on clean database
        working-directory: AgenticAI
        run: |
          python -m pytest -q -rs \
            --junitxml=../agentic-test-results.xml

      # These steps prepare data for the backend integration tests.
      - name: Seed legacy classroom
        run: |
          python -m agentic seed-demo --classroom 1.01

      - name: Fill v2 demo reviews and analytics
        run: |
          python -m agentic_lab fill-demo

      - name: Run backend tests with demo data
        working-directory: Backend
        run: |
          python -m pytest -q -rs \
            --junitxml=../backend-test-results.xml

      # A passing test command must not hide skipped tests.
      - name: Fail if required tests were skipped
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          errors = []

          reports = (
              "agentic-test-results.xml",
              "backend-test-results.xml",
          )

          for filename in reports:
              path = Path(filename)

              if not path.exists():
                  errors.append(f"{filename}: results missing")
                  continue

              root = ET.parse(path).getroot()
              skipped = root.findall(".//testcase/skipped")

              if skipped:
                  errors.append(
                      f"{filename}: {len(skipped)} skipped test(s)"
                  )

          if errors:
              raise SystemExit("\n".join(errors))

          print("All required tests executed with zero skips.")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports
          path: '*-test-results.xml'
          if-no-files-found: warn
